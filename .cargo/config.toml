[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"

[env]
# "info" alone would apply to every crate, including smoltcp/embassy-net/
# esp-radio, which are otherwise noisy at that level -- interleaved on the
# same USB-Serial-JTAG wire Improv Serial uses, that log traffic was a
# suspected contributor to Improv responses missing the browser's tight
# reconnect timeout once Wi-Fi/HTTP started running. Only main.rs (which
# calls init_logger_from_env, not init_logger) actually reads this filter.
ESP_LOG="warn,embewi_agent_esp=info"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

# TEMPORARY (feat/esp32s3-target branch): revert to
# "riscv32imc-unknown-none-elf" if/when this branch goes back to ESP32-C3.
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
