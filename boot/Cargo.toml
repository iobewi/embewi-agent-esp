# embewi-boot -- second-stage bootloader for the ESP32-C3 (Rust, no ESP-IDF).
#
# SPIKE (step 1 of the boot chain): prove ROM -> embewi-boot -> ota_0 ->
# embewi-agent on real hardware. Deliberately no rollback, no otadata state
# machine, no watchdog handover yet -- see boot/README.md.
#
# Its own workspace root: the agent's `[workspace]` excludes this directory
# (they share a target triple but not a linker script, a memory layout or a
# feature set, so they must not unify into one Cargo.lock/feature graph).
[workspace]

[package]
edition      = "2024"
name         = "embewi-boot"
rust-version = "1.88"
version      = "0.0.1"
license      = "MIT"

[dependencies]
esp-hal     = { version = "~1.1.0", features = ["esp32c3"] }
esp-println = { version = "0.17.0", features = ["esp32c3"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
lto              = "fat"
opt-level        = "s"
panic            = "abort"
debug            = 2
overflow-checks  = false
