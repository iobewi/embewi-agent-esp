# embewi-boot -- second-stage bootloader for the ESP32-C3 (Rust, no ESP-IDF).
#
# Its own workspace root: the agent's `[workspace]` excludes this directory
# (they share a target triple but not a linker script, a memory layout or a
# feature set, so they must not unify into one Cargo.lock/feature graph).
[workspace]

[package]
edition      = "2024"
name         = "embewi-boot"
rust-version = "1.88"
version      = "0.0.2"
license      = "MIT"

[dependencies]
esp-hal     = { version = "~1.1.0", features = ["esp32c3"] }
esp-println = { version = "0.17.0", features = ["esp32c3"] }
# Every decision (which slot, what to write, is the image bootable) lives in
# atomic-boot, tested on the host; this crate only performs it on real flash.
atomic-boot = { git = "https://github.com/iobewi/atomic-boot", rev = "594ffbf" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
lto              = "fat"
opt-level        = "s"
panic            = "abort"
debug            = 2
overflow-checks  = false
