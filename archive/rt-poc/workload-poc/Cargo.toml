[package]
name         = "workload-poc"
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"

# Deliberately its own workspace root (empty [workspace] table), NOT a member
# of the agent's workspace at the repo root. It targets the same
# riscv32imc-unknown-none-elf triple but needs an entirely different build:
# a custom linker script pinning it to a fixed flash-mapped address, no
# esp-hal runtime/vector table/panic machinery (the "rt"/"exception-handler"
# default features are explicitly left off below), no allocator. Building it
# from inside this directory (`cd crates/workload-poc && cargo build
# --release`) picks up its own .cargo/config.toml instead of the root one.
[workspace]

[[bin]]
name    = "workload-poc"
path    = "src/main.rs"
test    = false
bench   = false
doctest = false

[dependencies]
# Only for `Peripherals::steal()` + the `Output` GPIO driver used once in
# `workload_entry` (see src/main.rs's doc comment) -- default features
# (which pull in esp-hal's own startup/vector-table/panic-handler runtime,
# "rt" and "exception-handler") are deliberately disabled: this binary is
# never booted by the chip directly, it's called/interrupt-dispatched into
# from the agent's already-running program, and must not install a second,
# competing copy of any of that.
esp-hal = { version = "~1.1.0", default-features = false, features = [
  "esp32c3",
  "unstable",
] }

[profile.release]
opt-level      = "s"
lto            = true
panic          = "abort"
codegen-units  = 1
