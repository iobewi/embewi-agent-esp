<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embewi Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <h1>Embewi Agent</h1>
        <p class="subtitle">Configuration</p>
      </div>
      <a class="button-link" href="/">Actualiser</a>
    </header>

    {{MESSAGE}}

    <form
      class="card"
      method="post"
      onsubmit="return confirm('Enregistrer, verrouiller la configuration et redémarrer l\'appareil ? Cette page ne sera plus accessible tant que l\'appareil n\'aura pas été réinstallé avec effacement complet (ESP Web Tools).')"
    >
      <label for="led_gpio">Broche GPIO de la LED de statut</label>
      <select id="led_gpio" name="led_gpio">
        {{OPTIONS}}
      </select>

      <label for="node_id">Identifiant du nœud (node_id)</label>
      <input type="text" id="node_id" name="node_id" maxlength="63" required value="{{NODE_ID}}">

      <label for="ctrl_url">URL du contrôleur Kubernetes</label>
      <input type="text" id="ctrl_url" name="ctrl_url" maxlength="128" placeholder="http://192.168.1.10:8080" value="{{CTRL_URL}}">

      <button class="primary" type="submit">Enregistrer</button>
    </form>

    <p class="hint">
      Enregistrer verrouille définitivement cette page et redémarre
      l'appareil. Le token d'authentification est généré automatiquement et
      affiché une seule fois, sur la page suivante -- copie-le à ce
      moment-là.
    </p>
  </main>
</body>
</html>
