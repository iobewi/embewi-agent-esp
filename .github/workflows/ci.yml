name: Rust

on:
  push:
  pull_request:

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - run: bash -n scripts/test-api.sh
      - run: cargo test --target x86_64-unknown-linux-gnu -p ota-logic
      - run: cargo test --target x86_64-unknown-linux-gnu -p config-space-manager

  check-bootloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - run: cargo check --manifest-path boot/Cargo.toml --locked --release

  check-esp32c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - run: cargo check --locked
