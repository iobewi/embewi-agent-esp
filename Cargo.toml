[workspace]
# `crates/ota-logic` isolates the OTA write-session's pure decision logic
# (contrat §4's `Content-Range` resume protocol) from everything
# `esp-hal`-dependent, specifically so it can be unit-tested with a plain
# `cargo test` -- see that crate's own doc comment. The root package below
# is implicitly a workspace member too.
members = ["crates/ota-logic", "crates/embewi-boot-core"]
# `boot/` (embewi-boot) is a separate Cargo project with its own linker script.
exclude = ["boot"]

[package]
edition      = "2024"
name         = "embewi-agent-esp"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "embewi-agent-esp"
path = "./src/bin/main.rs"

[features]
# TEST/DEBUG ONLY -- never enable in a production image. Makes the
# pending_verify self-check reset the device right after it passes but
# BEFORE confirming (`ota.rs`'s `selfcheck_task`), deterministically
# exercising embewi-boot's `Pending -> Aborted -> fallback` rollback path
# without needing to time a physical power-cut against a live self-check
# window (which normally completes before Wi-Fi even reconnects).
fault-injection = []
# TEST/DEBUG ONLY -- never enable in a production image. A stronger variant
# of `fault-injection`: instead of a clean `software_reset()` after the
# self-check passes, spins forever right at the top of `selfcheck_task`,
# starving the whole (single-threaded) embassy executor before either the
# self-check or its own software deadline ever gets polled again -- the one
# failure a purely software timeout structurally cannot catch, since it
# depends on the same stuck executor. Proves the *hardware* watchdog alone
# forces the eventual reset, with zero cooperation from any of this
# firmware's own code.
fault-injection-freeze = []

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-hal-smartled2 = "0.29.0"
smart-leds        = "0.4"
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-storage       = { version = "0.9.0", features = ["esp32c3"] }
esp-nvs           = { version = "0.5.0", features = ["esp32c3"] }
embedded-storage  = "0.3.1"

# No chip feature declared here: it rides on whatever chip esp-hal above is
# built for (Cargo unifies features per resolved crate version), so
# `chip_pretty!()` always matches the active target instead of a hardcoded
# string that could silently go stale, e.g. when switching esp-hal's own
# "esp32c3" feature to "esp32s3".
esp-metadata-generated = "0.4.0"

embassy-sync = "0.8.0"
picoserve    = { version = "0.20.0", features = ["embassy", "alloc"] }
serde        = { version = "1", default-features = false, features = ["derive"] }
serde_json   = { version = "1", default-features = false, features = ["alloc"] }
# Constant-time Bearer token comparison (contrat §1).
subtle       = { version = "2", default-features = false }

# SNTP (contrat §5) -- split into three crates upstream (core protocol,
# embassy-net UDP adapter, embassy-time timestamp generator) so each can be
# versioned independently of the others.
sntpc              = { version = "0.11", default-features = false, features = ["log"] }
sntpc-net-embassy  = { version = "0.11", default-features = false, features = ["log"] }
sntpc-time-embassy = "0.6"

# ESP_LOGx streaming outbound (contrat §5, WebSocket) -- a client-side WS
# handshake+framing stack, not a full HTTP server. Deliberately not
# reusing picoserve's own "ws" feature: that's for handling *inbound*
# upgrade requests, we need the reverse (connecting out to the Core). Only
# `edge_http::ws`'s plain header-building functions are used now (the WS
# handshake runs over a `tls::connect_client` session by hand -- see
# log_stream.rs's doc comment) and `edge_ws` for frame I/O; `edge-nal`/
# `edge-nal-embassy` (the TCP transport `edge_http::io::client::Connection`
# needed) and `reqwless` (heartbeat's old plain-HTTP client, same TLS gap)
# are gone along with that rewrite.
edge-http = { version = "0.8", default-features = false, features = ["io"] }
edge-ws   = { version = "0.8", default-features = false, features = ["io"] }
heapless  = "0.9"
# Parses the WS upgrade response once `log_stream.rs` hand-rolls the
# handshake over a TLS session (see that module's doc comment for why it
# no longer goes through `edge_http::io::client::Connection`). Already in
# the dependency tree transitively (edge-http itself uses it) -- named
# directly here just to be `use`-able.
httparse = { version = "1", default-features = false }

# OTA A/B (contrat §3/§4/§6). Streaming digest of the `.bin` as it's written
# (no post-hoc flash re-read, per the contract) -- pure-Rust software
# implementation, no hardware SHA peripheral binding needed.
sha2 = { version = "0.10", default-features = false }
# Races the self-check against contrat §3's bounded deadline.
embassy-futures = "0.1"
# Pure write-session decision logic (Content-Range resume), unit-tested on
# host -- see crates/ota-logic's own doc comment.
ota-logic = { path = "crates/ota-logic" }
# otadata semantics (which slot is active, what to write to confirm/reject/
# activate one), shared with embewi-boot (boot/) -- see src/ota.rs.
embewi-boot-core = { path = "crates/embewi-boot-core" }
# MbedTLS's SSL record buffers default to 16 KiB *per direction* (32 KiB
# total) -- fine on a desktop, but most of this device's ~100 KiB heap on
# its own, and the reason a TLS 1.3 handshake (more state live at once than
# 1.2) failed with `MBEDTLS_ERR_SSL_ALLOC_FAILED` while 1.2 didn't.
#
# Outgoing (`ssl-out-content-len`) is cut to 2 KiB: this agent's own
# responses (small EC certs, JSON/HTML) are always a few hundred bytes to a
# few KiB, so MbedTLS just splits a rare larger one across more records --
# a throughput trade this agent controls, not a correctness one, since it's
# also the one deciding how much to write per call.
#
# Incoming (`ssl-in-content-len`) is kept at the standard 16 KiB, NOT cut to
# match: unlike outgoing, an oversized *incoming* record isn't something
# this side gets to negotiate down. Standard TLS gives a server no way to
# tell a compliant peer "send me smaller records" -- `max_fragment_length`
# only lets an endpoint bound what it RECEIVES in the direction that
# extension covers, and even then only if the peer honours it; a client
# already mid-handshake, or one that simply ignores the extension, can
# still legally send up to a full 16 KiB plaintext record. A 2 KiB incoming
# buffer therefore isn't "smaller records, same protocol" the way a smaller
# outgoing buffer is -- it silently drops the connection (no HTTP response
# at all) the moment any standards-compliant client's write pattern
# produces one incoming record above ~1.7 KiB (measured: a single
# `PUT /v1alpha1/ota/write` body from ~1.7 KiB up over HTTPS, headers
# included in the same record, killed the connection outright -- found
# while exercising a sector-sized, 4 KiB OTA write chunk over TLS for the
# first time). +14 KiB of heap (out stays 2 KiB, so this isn't +28 KiB)
# buys back interoperability with any client that doesn't happen to
# fragment its own writes under that threshold -- which nothing in the
# contract asks a Core implementation to guarantee.
# `default-features = false` drops the "tls" bundle, which pulls in RSA,
# DES, Camellia, ARIA, MD5, RIPEMD160, PKCS7, x509-*write*, every EC curve,
# and every key-exchange mode MbedTLS supports -- ~314 KiB of C code for a
# device that only ever does ECDSA/ECDHE over P-256 with our own small,
# self-issued certs (never generates one on-device, hence no x509-write).
# Kept AES/GCM/CBC alongside ChaCha20-Poly1305 (the cipher suite our own
# handshakes actually negotiated) for compatibility margin rather than
# trimming to the bare minimum on the first pass.
mbedtls-rs = { version = "0.3.0", default-features = false, features = [
  "tls-core", "tls-client", "tls-server",
  "tls-proto-tls12", "tls-proto-tls13",
  "x509-parse", "pk", "pem-parse", "base64",
  "alg-sha256", "alg-sha512", "alg-hkdf",
  "alg-ecp", "alg-ecdh", "alg-ecdsa", "curve-secp256r1",
  "alg-gcm", "alg-chacha20", "alg-chachapoly", "alg-aes", "cipher-mode-cbc",
  "kex-ecdhe-ecdsa",
  "drbg-ctr", "entropy",
  "tls-debug",
  # X.509 notBefore/notAfter checks (off by default); needs the clock
  # installed in `tls::init`, and brings `hook-timer` with it.
  "hook-wall-clock",
  "ssl-in-content-len-16384", "ssl-out-content-len-2048",
] }
# `EspCryptoRng` (src/tls.rs) implements this directly against
# `esp_hal::rng::Rng` -- named here so we can name the trait, not just a
# transitive dependency of mbedtls-rs.
rand_core = { version = "0.10.1", default-features = false }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
